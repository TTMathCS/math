site_name: Math
site_url: https://math.akadian.ca/
site_description: Mathematics from a first puzzle to open research problems, by branch and by topic, with the reasoning written out
repo_url: https://github.com/TTMathCS/math
edit_uri: edit/main/docs/
copyright: 'Part of <a href="https://www.akadian.ca/">Mars – your new home</a>'
# notes for the repo, not pages
exclude_docs: |
  README.md
# pages keep their .html names, so the course guides' own links between chapters work as written
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  favicon: assets/akadian-icon.png   # the Akadian A, as on akadian.ca
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Light colours
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark colours
  font: false

extra_css:
  - fonts/fonts.css
  - stylesheets/mars.css
  - stylesheets/course.css
  - stylesheets/topics.css
  - stylesheets/reader.css
  - stylesheets/sketch.css
  - stylesheets/play.css
  - katex/katex.min.css
  - stylesheets/ask.css

extra:
  homepage: https://www.akadian.ca/

extra_javascript:
  - https://www.akadian.ca/home-music.js?site   # the song from www.akadian.ca: it goes on here while it plays (Mars-Home home-music.js)
  - javascripts/mars-link.js
  - javascripts/home-link.js
  - katex/katex.min.js
  - katex/auto-render.min.js
  - javascripts/math.js
  - javascripts/levels.js
  - javascripts/reader.js
  - javascripts/play.js
  - javascripts/levelcheck.js
  - javascripts/ask.js

markdown_extensions:
  - toc:
      permalink: true
      title: On this page
  - tables
  - admonition
  - pymdownx.details
  - md_in_html
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

# With --strict, a broken link or #anchor stops the build
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# One section per shelf. A new shelf (high school, fun math ...) is a folder in docs/ and a section here (README.md).

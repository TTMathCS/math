site_name: Math
site_url: https://math.akadian.ca/
site_description: Math by course, shelf by shelf, with the reasoning written out
repo_url: https://github.com/TTMathCS/math
edit_uri: edit/main/docs/
copyright: 'Part of <a href="https://www.akadian.ca/">Mars – your new home</a>'
# notes for the repo, not pages
exclude_docs: |
  README.md
# pages keep their .html names, so the course guides' own links between chapters work as written
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunset-up
        name: Mars dawn
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mars night
  font: false

extra_css:
  - fonts/fonts.css
  - stylesheets/mars.css
  - stylesheets/course.css

extra:
  homepage: https://www.akadian.ca/

extra_javascript:
  - javascripts/mars-link.js
  - javascripts/home-link.js

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.details
  - md_in_html
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences

# With --strict, a broken link or #anchor stops the build
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# One section per shelf. A new shelf (high school, fun math ...) is a folder in docs/ and a section here (README.md).
